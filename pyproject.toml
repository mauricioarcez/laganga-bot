[project]
name = "laganga-bot"
version = "0.2.3"
description = "Bot for posting flash deals from La Ganga Ofertas to social networks"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mauricio Arce", email = "mauricioarcez23@gmail.com" }
]
dependencies = [
    "requests>=2.31.0",
    "tweepy>=4.14.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laganga_bot"]

