name: Twitter Bot

on:
  schedule:
    # 17:00 Argentina time is 20:00 UTC
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-deal:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Twitter Bot
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_KEY_SECRET: ${{ secrets.TWITTER_API_KEY_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          FLASH_DEALS_API_URL: ${{ secrets.FLASH_DEALS_API_URL }}
        run: uv run python -m laganga_bot.main

      - name: Commit and Push DB Changes
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state/bot_history.db
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update bot state [skip ci]" && git push)
