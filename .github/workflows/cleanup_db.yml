name: Cleanup DB

on:
  schedule:
    # Run at 00:00 on day-of-month 1 and 15.
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-db:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Cleanup
        run: uv run python -m laganga_bot.main --clear-db

      - name: Commit and Push DB Changes
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state/bot_history.db
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Cleanup bot history [skip ci]" && git push)
